<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1600" viewBox="0 0 2400 1600" role="img" aria-labelledby="title desc">
  <title id="title">BabySteps 性能事件六阶段闭环时序图</title>
  <desc id="desc">从采集、批量上报、异步入队、ECS 清洗、真实统计到 Evidence 与清理，展示 sendBeacon、失败静默、SQS 三次重试、幂等写入、sampleCount、DROP SCHEMA 和 delete-stack。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffaf0"/><stop offset="1" stop-color="#e5f0e2"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#173d46" flood-opacity=".15"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#286a75"/></marker><marker id="e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8a5d86"/></marker><style>text{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;fill:#173d46}.title{font-size:45px;font-weight:900;fill:#fffaf0}.sub{font-size:20px;font-weight:650;fill:#dcebe5}.actor{font-size:19px;font-weight:900;fill:#fffaf0}.phase{font-size:22px;font-weight:900}.body{font-size:16px;font-weight:650}.small{font-size:14px;font-weight:650;fill:#536b70}.ok{fill:#4e855b}.warn{fill:#d69435}.req{fill:none;stroke:#286a75;stroke-width:3.5;marker-end:url(#a)}.ret{fill:none;stroke:#4e855b;stroke-width:3.5;stroke-dasharray:9 7;marker-end:url(#a)}.event{fill:none;stroke:#8a5d86;stroke-width:3.5;stroke-dasharray:11 8;marker-end:url(#e)}.life{stroke:#9cb2ad;stroke-width:2;stroke-dasharray:8 8}</style></defs>
  <rect width="2400" height="1600" fill="url(#bg)"/><rect x="24" y="24" width="2352" height="1552" rx="34" fill="none" stroke="#173d46" stroke-width="5"/><rect x="44" y="44" width="2312" height="108" rx="28" fill="#173d46" filter="url(#shadow)"/>
  <text x="82" y="92" class="title">BabySteps × StarBuddy · 性能事件闭环时序图</text><text x="84" y="127" class="sub">六阶段：采集 → 批量上报 → 异步入队 → ECS 清洗 → 真实统计 → Evidence 与清理</text>
  <g transform="translate(60 180)">
    <g><rect width="260" height="66" rx="17" fill="#55775e"/><text x="130" y="41" text-anchor="middle" class="actor">浏览器 SDK</text></g>
    <g transform="translate(330)"><rect width="260" height="66" rx="17" fill="#315d66"/><text x="130" y="41" text-anchor="middle" class="actor">Worker</text></g>
    <g transform="translate(660)"><rect width="260" height="66" rx="17" fill="#6e6582"/><text x="130" y="41" text-anchor="middle" class="actor">API / Lambda</text></g>
    <g transform="translate(990)"><rect width="260" height="66" rx="17" fill="#9b6626"/><text x="130" y="41" text-anchor="middle" class="actor">SQS / DLQ</text></g>
    <g transform="translate(1320)"><rect width="260" height="66" rx="17" fill="#a57335"/><text x="130" y="41" text-anchor="middle" class="actor">ECS Cleaner</text></g>
    <g transform="translate(1650)"><rect width="260" height="66" rx="17" fill="#566b83"/><text x="130" y="41" text-anchor="middle" class="actor">PostgreSQL</text></g>
    <g transform="translate(1980)"><rect width="260" height="66" rx="17" fill="#2f7150"/><text x="130" y="41" text-anchor="middle" class="actor">Actions / Evidence</text></g>
  </g>
  <g class="life"><line x1="190" y1="246" x2="190" y2="1460"/><line x1="520" y1="246" x2="520" y2="1460"/><line x1="850" y1="246" x2="850" y2="1460"/><line x1="1180" y1="246" x2="1180" y2="1460"/><line x1="1510" y1="246" x2="1510" y2="1460"/><line x1="1840" y1="246" x2="1840" y2="1460"/><line x1="2170" y1="246" x2="2170" y2="1460"/></g>

  <g>
    <rect x="58" y="280" width="2284" height="165" rx="22" fill="#eff6e9" stroke="#55775e"/><circle cx="92" cy="316" r="22" fill="#55775e"/><text x="92" y="324" text-anchor="middle" class="actor">01</text><text x="130" y="324" class="phase">01 采集</text>
    <path class="req" d="M190 350H500"/><text x="345" y="338" text-anchor="middle" class="body">PerformanceObserver：LCP / CLS / INP / FCP / TTFB</text><path class="req" d="M190 392H500"/><text x="345" y="380" text-anchor="middle" class="body">resource / JS error / custom / web3 duration</text><text x="850" y="365" text-anchor="middle" class="small">采样 + 每分钟限流；不采 Token、Cookie、请求体、PII</text><text x="1510" y="365" text-anchor="middle" class="small">SDK 失败静默，不破坏宿主应用</text>

    <rect x="58" y="465" width="2284" height="185" rx="22" fill="#edf6f7" stroke="#315d66"/><circle cx="92" cy="501" r="22" fill="#315d66"/><text x="92" y="509" text-anchor="middle" class="actor">02</text><text x="130" y="509" class="phase">02 批量上报</text>
    <path class="req" d="M190 540H520"/><text x="355" y="528" text-anchor="middle" class="body">20 条或 5 秒 flush · sendBeacon 优先</text><path class="req" d="M190 590H520"/><text x="355" y="578" text-anchor="middle" class="body">fetch keepalive 兜底 · pagehide 最后发送</text><path class="req" d="M520 565H850"/><text x="685" y="553" text-anchor="middle" class="body">Worker 注入 Origin Token + request-id</text><path class="ret" d="M850 610H520"/><text x="685" y="633" text-anchor="middle" class="small">502 → 页面诚实降级；客户端不重试风暴</text>

    <rect x="58" y="670" width="2284" height="175" rx="22" fill="#f4f0fb" stroke="#6e6582"/><circle cx="92" cy="706" r="22" fill="#6e6582"/><text x="92" y="714" text-anchor="middle" class="actor">03</text><text x="130" y="714" class="phase">03 异步入队</text>
    <path class="req" d="M520 748H850"/><text x="685" y="736" text-anchor="middle" class="body">POST /events · 128 KB 上限</text><path class="event" d="M850 748H1180"/><text x="1015" y="736" text-anchor="middle" class="body">Schema / Token / 24h 时间窗通过后逐条入队</text><path class="ret" d="M1180 800H850"/><text x="1015" y="823" text-anchor="middle" class="body">202 { accepted } 仅在入队成功后</text>

    <rect x="58" y="865" width="2284" height="210" rx="22" fill="#fff5df" stroke="#9b6626"/><circle cx="92" cy="901" r="22" fill="#9b6626"/><text x="92" y="909" text-anchor="middle" class="actor">04</text><text x="130" y="909" class="phase">04 ECS 清洗</text>
    <path class="event" d="M1180 945H1510"/><text x="1345" y="933" text-anchor="middle" class="body">ReceiveMessage · 一次最多 10 条 · 长轮询</text><path class="req" d="M1510 990H1840"/><text x="1675" y="978" text-anchor="middle" class="body">脱敏 / route 归一化 / 二次校验</text><path class="ret" d="M1840 1032H1510"/><text x="1675" y="1055" text-anchor="middle" class="body">INSERT ... ON CONFLICT DO NOTHING · 幂等写入</text><path class="event" d="M1510 1032H1180"/><text x="1345" y="1055" text-anchor="middle" class="small">成功 DeleteMessage；暂时失败 maxReceiveCount = 3 → DLQ</text>

    <rect x="58" y="1095" width="2284" height="170" rx="22" fill="#eef2fa" stroke="#566b83"/><circle cx="92" cy="1131" r="22" fill="#566b83"/><text x="92" y="1139" text-anchor="middle" class="actor">05</text><text x="130" y="1139" class="phase">05 真实统计</text>
    <path class="req" d="M190 1175H520"/><text x="355" y="1163" text-anchor="middle" class="body">时间 / route / metric / env / version 筛选</text><path class="req" d="M520 1175H850"/><path class="req" d="M850 1175H1840"/><text x="1345" y="1163" text-anchor="middle" class="body">参数化 SQL · 最多 10,000 条真实样本</text><path class="ret" d="M1840 1220H190"/><text x="1015" y="1243" text-anchor="middle" class="body">sampleCount + 真实 p50 / p75 / p95 + errorRate + route 对比；不平均 percentile</text>

    <rect x="58" y="1285" width="2284" height="205" rx="22" fill="#eaf5ea" stroke="#2f7150"/><circle cx="92" cy="1321" r="22" fill="#2f7150"/><text x="92" y="1329" text-anchor="middle" class="actor">06</text><text x="130" y="1329" class="phase">06 Evidence 与清理</text>
    <path class="req" d="M2170 1360H850"/><text x="1510" y="1348" text-anchor="middle" class="body">OIDC → 临时栈 → 本地 Chromium / Worker → 415 collected → ECS 103 inserted → Live stats</text><path class="req" d="M2170 1410H1840"/><text x="2005" y="1398" text-anchor="middle" class="body">清理前 SQS visible=80 · 未验证全量排空</text><path class="event" d="M2170 1450H1510"/><text x="1840" y="1438" text-anchor="middle" class="body">保存媒体 → DROP SCHEMA → delete-stack → 复核 12 类项目资源全部为 0</text>
  </g>
  <rect x="58" y="1515" width="2284" height="44" rx="18" fill="#173d46"/><text x="84" y="1544" class="body" style="fill:#f5dfb8">Run 33160455921 · 本地浏览器接临时 AWS · 103 条样本链已验证 · 全量队列排空未验证 · DROP SCHEMA / delete-stack / 零残留已验证</text>
</svg>
