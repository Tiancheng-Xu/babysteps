<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">BabySteps 核心业务时序图</title>
  <desc id="desc">从 Provider 创建成长任务、Owner 审核、Chainlink VRF 随机定价，到家长授权购买、完成确认、SBT 铸造和独立读回的完整时序及失败路径。</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffaf0"/><stop offset="1" stop-color="#f4ede3"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe6a4"/><stop offset="1" stop-color="#f6b963"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#173b4d" flood-opacity="0.14"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#315d66"/></marker>
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#c67b2b"/></marker>
    <style>
      .title{font:800 38px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#173b4d}
      .subtitle{font:600 17px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#597078}
      .actor{font:800 15px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#173b4d}
      .step{font:700 14px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#294d59}
      .small{font:600 12px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#5a7077}
      .number{font:800 14px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#fff}
      .life{stroke:#7f9499;stroke-width:2;stroke-dasharray:6 7}
      .arrow{stroke:#315d66;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
      .chain{stroke:#c67b2b;stroke-width:2.5;fill:none;marker-end:url(#arrowGold)}
      .return{stroke:#55775e;stroke-width:2.2;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#paper)"/>
  <path d="M0 0H1600V14H0Z" fill="#173b4d"/>
  <circle cx="72" cy="62" r="35" fill="url(#gold)" stroke="#173b4d" stroke-width="4"/>
  <path d="M72 35l8 17 19 2-14 13 4 19-17-9-17 9 4-19-14-13 19-2z" fill="#fff7d2" stroke="#9e6630" stroke-width="2"/>
  <text x="125" y="58" class="title">成长任务购买与证书 · 核心业务时序</text>
  <text x="127" y="87" class="subtitle">Provider → Owner → VRF → approve / buy → 完成 → ERC-5192 SBT → 独立读回</text>

  <!-- actors -->
  <g transform="translate(42,116)">
    <g filter="url(#shadow)"><rect width="170" height="66" rx="17" fill="#e5eedb" stroke="#55775e" stroke-width="2"/><text x="85" y="39" text-anchor="middle" class="actor">Provider 钱包</text></g>
    <g transform="translate(205)" filter="url(#shadow)"><rect width="170" height="66" rx="17" fill="#fffdf7" stroke="#315d66" stroke-width="2"/><text x="85" y="30" text-anchor="middle" class="actor">React / 家长钱包</text><text x="85" y="49" text-anchor="middle" class="small">Privy · Reown</text></g>
    <g transform="translate(410)" filter="url(#shadow)"><rect width="170" height="66" rx="17" fill="#ebe5f7" stroke="#806f8c" stroke-width="2"/><text x="85" y="30" text-anchor="middle" class="actor">Worker / D1</text><text x="85" y="49" text-anchor="middle" class="small">富内容 · 哈希 · 会话</text></g>
    <g transform="translate(615)" filter="url(#shadow)"><rect width="170" height="66" rx="17" fill="#fff0c9" stroke="#c67b2b" stroke-width="2"/><text x="85" y="39" text-anchor="middle" class="actor">Owner 审核</text></g>
    <g transform="translate(820)" filter="url(#shadow)"><rect width="190" height="66" rx="17" fill="#fff0c9" stroke="#c67b2b" stroke-width="2"/><text x="95" y="30" text-anchor="middle" class="actor">Marketplace V2</text><text x="95" y="49" text-anchor="middle" class="small">BabyCoin 结算</text></g>
    <g transform="translate(1045)" filter="url(#shadow)"><rect width="170" height="66" rx="17" fill="#fff0c9" stroke="#c67b2b" stroke-width="2"/><text x="85" y="30" text-anchor="middle" class="actor">Chainlink VRF</text><text x="85" y="49" text-anchor="middle" class="small">v2.5</text></g>
    <g transform="translate(1250)" filter="url(#shadow)"><rect width="235" height="66" rx="17" fill="#dfedf3" stroke="#315d66" stroke-width="2"/><text x="118" y="29" text-anchor="middle" class="actor">Relayer / SBT / Index</text><text x="118" y="49" text-anchor="middle" class="small">完成确认 · Graph · RPC</text></g>
  </g>

  <!-- lifelines -->
  <g>
    <line x1="127" y1="184" x2="127" y2="765" class="life"/><line x1="332" y1="184" x2="332" y2="765" class="life"/>
    <line x1="537" y1="184" x2="537" y2="765" class="life"/><line x1="742" y1="184" x2="742" y2="765" class="life"/>
    <line x1="957" y1="184" x2="957" y2="765" class="life"/><line x1="1172" y1="184" x2="1172" y2="765" class="life"/>
    <line x1="1410" y1="184" x2="1410" y2="765" class="life"/>
  </g>

  <!-- phase labels -->
  <g transform="translate(18,205)"><rect width="28" height="88" rx="14" fill="#55775e"/><text transform="translate(20,77) rotate(-90)" class="number">任务上架</text></g>
  <g transform="translate(18,315)"><rect width="28" height="112" rx="14" fill="#c67b2b"/><text transform="translate(20,98) rotate(-90)" class="number">随机与审核</text></g>
  <g transform="translate(18,452)"><rect width="28" height="142" rx="14" fill="#9b5678"/><text transform="translate(20,125) rotate(-90)" class="number">授权与购买</text></g>
  <g transform="translate(18,620)"><rect width="28" height="128" rx="14" fill="#315d66"/><text transform="translate(20,110) rotate(-90)" class="number">完成与证明</text></g>

  <!-- happy path -->
  <g>
    <circle cx="73" cy="224" r="15" fill="#55775e"/><text x="73" y="229" text-anchor="middle" class="number">1</text>
    <path class="arrow" d="M127 224H525"/><text x="326" y="214" text-anchor="middle" class="step">创建草稿、视频/评论规则与 metadata</text>
    <path class="return" d="M537 260H139"/><text x="338" y="251" text-anchor="middle" class="small">返回 draftId + canonical hash</text>
    <circle cx="73" cy="286" r="15" fill="#55775e"/><text x="73" y="291" text-anchor="middle" class="number">2</text>
    <path class="chain" d="M127 286H945"/><text x="536" y="277" text-anchor="middle" class="step">requestTask(metadata URI / hash / payee)</text>

    <circle cx="688" cy="335" r="15" fill="#c67b2b"/><text x="688" y="340" text-anchor="middle" class="number">3</text>
    <path class="chain" d="M742 335H945"/><text x="844" y="325" text-anchor="middle" class="step">approveTask(taskId)</text>
    <path class="chain" d="M969 371H1160"/><text x="1065" y="361" text-anchor="middle" class="step">requestRandomWords</text>
    <circle cx="1224" cy="407" r="15" fill="#c67b2b"/><text x="1224" y="412" text-anchor="middle" class="number">4</text>
    <path class="chain" d="M1172 407H969"/><text x="1070" y="397" text-anchor="middle" class="step">回填随机价格 + 时间范围</text>

    <circle cx="278" cy="464" r="15" fill="#9b5678"/><text x="278" y="469" text-anchor="middle" class="number">5</text>
    <path class="chain" d="M332 464H945"/><text x="638" y="454" text-anchor="middle" class="step">读取任务、BabyCoin 余额与 allowance</text>
    <path class="return" d="M957 500H344"/><text x="650" y="491" text-anchor="middle" class="small">精确随机价格（2–4 BABY）</text>
    <circle cx="278" cy="536" r="15" fill="#9b5678"/><text x="278" y="541" text-anchor="middle" class="number">6</text>
    <path class="chain" d="M332 536H945"/><text x="638" y="526" text-anchor="middle" class="step">approve(精确金额) → buy(taskId)</text>
    <path class="chain" d="M957 574H344"/><text x="650" y="565" text-anchor="middle" class="step">transferFrom → PurchaseRecorded → receipt 成功</text>

    <circle cx="128" cy="633" r="15" fill="#315d66"/><text x="128" y="638" text-anchor="middle" class="number">7</text>
    <path class="arrow" d="M127 633H525"/><text x="326" y="623" text-anchor="middle" class="step">提交完成证据（链下富内容）</text>
    <path class="arrow" d="M549 669H1398"/><text x="974" y="659" text-anchor="middle" class="step">受限 Relayer：confirmCompletion(purchaseId, evidenceHash)</text>
    <circle cx="1360" cy="705" r="15" fill="#315d66"/><text x="1360" y="710" text-anchor="middle" class="number">8</text>
    <path class="chain" d="M957 705H1398"/><text x="1178" y="695" text-anchor="middle" class="step">mint ERC-5192 SBT · locked</text>
    <circle cx="278" cy="741" r="15" fill="#315d66"/><text x="278" y="746" text-anchor="middle" class="number">9</text>
    <path class="return" d="M1410 741H344"/><text x="877" y="732" text-anchor="middle" class="step">The Graph + Public / Infura / Alchemy 独立读回</text>
  </g>

  <!-- failure boundary -->
  <g transform="translate(42,785)">
    <rect width="1516" height="172" rx="24" fill="#173b4d"/>
    <text x="26" y="34" class="actor" fill="#ffe0a2">失败与降级路径（不伪造成功）</text>
    <g transform="translate(25,54)">
      <rect width="280" height="92" rx="15" fill="#fff8e8"/>
      <text x="18" y="27" class="actor">metadata 哈希不一致</text>
      <text x="18" y="52" class="small">Worker 返回冲突并停止绑定</text>
      <text x="18" y="73" class="small">不覆盖链上或 D1 事实</text>
    </g>
    <g transform="translate(323,54)">
      <rect width="280" height="92" rx="15" fill="#fff8e8"/>
      <text x="18" y="27" class="actor">VRF pending / 余额不足</text>
      <text x="18" y="52" class="small">任务保持待履约状态</text>
      <text x="18" y="73" class="small">补资后继续，不重复建任务</text>
    </g>
    <g transform="translate(621,54)">
      <rect width="280" height="92" rx="15" fill="#fff8e8"/>
      <text x="18" y="27" class="actor">allowance / receipt 失败</text>
      <text x="18" y="52" class="small">不记录购买、不刷新伪余额</text>
      <text x="18" y="73" class="small">保留明确错误与交易哈希</text>
    </g>
    <g transform="translate(919,54)">
      <rect width="280" height="92" rx="15" fill="#fff8e8"/>
      <text x="18" y="27" class="actor">Relayer 暂不可用</text>
      <text x="18" y="52" class="small">有界重试 + idempotency key</text>
      <text x="18" y="73" class="small">不重复完成、不重复铸证</text>
    </g>
    <g transform="translate(1217,54)">
      <rect width="274" height="92" rx="15" fill="#fff8e8"/>
      <text x="18" y="27" class="actor">索引延迟 / RPC 分歧</text>
      <text x="18" y="52" class="small">回退合约直接读取</text>
      <text x="18" y="73" class="small">Evidence 标记待验证</text>
    </g>
  </g>
</svg>
