<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">BabySteps 与 StarBuddy Web3 全局架构图</title>
  <desc id="desc">展示用户运行时、Cloudflare 数据层、Ethereum Sepolia 合约与外部读取、交付和 AWS 安全边界，以及验证、失败停止和清理路径。</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#f5eddf"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe6a4"/>
      <stop offset="1" stop-color="#f6b963"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#173b4d" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#315d66"/>
    </marker>
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#c67b2b"/>
    </marker>
    <style>
      .title{font:800 38px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#173b4d}
      .subtitle{font:600 17px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#597078}
      .laneTitle{font:800 22px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#173b4d}
      .cardTitle{font:800 18px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#173b4d}
      .body{font:600 14px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#3e5c65}
      .small{font:600 12px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#587078}
      .badge{font:800 12px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:.04em}
      .flow{stroke:#315d66;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .chain{stroke:#c67b2b;stroke-width:3;fill:none;marker-end:url(#arrowGold)}
      .deferred{stroke:#806f8c;stroke-width:3;stroke-dasharray:8 7;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#paper)"/>
  <path d="M0 0H1600V14H0Z" fill="#173b4d"/>
  <circle cx="72" cy="62" r="35" fill="url(#gold)" stroke="#173b4d" stroke-width="4"/>
  <path d="M72 35l8 17 19 2-14 13 4 19-17-9-17 9 4-19-14-13 19-2z" fill="#fff7d2" stroke="#9e6630" stroke-width="2"/>
  <text x="125" y="58" class="title">BabySteps × StarBuddy Web3 全局架构</text>
  <text x="127" y="87" class="subtitle">真实实现视图 · Ethereum Sepolia 11155111 · 测试资产不涉及真实投资</text>

  <g transform="translate(1180,28)">
    <rect width="120" height="32" rx="16" fill="#dce9c8" stroke="#55775e"/>
    <circle cx="17" cy="16" r="6" fill="#4f875c"/><text x="31" y="21" class="badge" fill="#355940">已验证</text>
    <rect x="130" width="150" height="32" rx="16" fill="#fff0c9" stroke="#c78532"/>
    <circle cx="147" cy="16" r="6" fill="#dc9738"/><text x="161" y="21" class="badge" fill="#8b581c">已实现待验证</text>
    <rect x="290" width="126" height="32" rx="16" fill="#ebe5f7" stroke="#806f8c"/>
    <circle cx="307" cy="16" r="6" fill="#806f8c"/><text x="321" y="21" class="badge" fill="#5f5269">计划 / 延后</text>
  </g>

  <!-- Lane 1: runtime -->
  <g transform="translate(36,118)">
    <rect width="1528" height="168" rx="24" fill="#f8fbf5" stroke="#7d9e84" stroke-width="2"/>
    <rect width="190" height="168" rx="24" fill="#e5eedb"/>
    <text x="28" y="48" class="laneTitle">01 用户运行时</text>
    <text x="28" y="77" class="body">签名、浏览、购买</text>
    <text x="28" y="99" class="body">不托管用户私钥</text>
    <g transform="translate(220,25)" filter="url(#shadow)">
      <rect width="200" height="116" rx="18" fill="#fffdf7" stroke="#315d66" stroke-width="2"/>
      <text x="100" y="37" text-anchor="middle" class="cardTitle">家长 / Provider / Owner</text>
      <text x="100" y="66" text-anchor="middle" class="body">浏览器 · H5 · 移动钱包</text>
      <text x="100" y="91" text-anchor="middle" class="small">角色决定可执行动作</text>
    </g>
    <path class="flow" d="M430 83H482"/>
    <g transform="translate(490,25)" filter="url(#shadow)">
      <rect width="210" height="116" rx="18" fill="#fffdf7" stroke="#315d66" stroke-width="2"/>
      <text x="105" y="37" text-anchor="middle" class="cardTitle">React 产品前端</text>
      <text x="105" y="66" text-anchor="middle" class="body">任务 · 成长 · 兑换 · Evidence</text>
      <text x="105" y="91" text-anchor="middle" class="small">Cloudflare Pages · 已验证</text>
    </g>
    <path class="flow" d="M710 83H762"/>
    <g transform="translate(770,25)" filter="url(#shadow)">
      <rect width="220" height="116" rx="18" fill="#fffdf7" stroke="#315d66" stroke-width="2"/>
      <text x="110" y="37" text-anchor="middle" class="cardTitle">Privy + Reown / 外部钱包</text>
      <text x="110" y="66" text-anchor="middle" class="body">邮箱、Google、钱包连接</text>
      <text x="110" y="91" text-anchor="middle" class="small">Allowed Origin 已配置</text>
    </g>
    <path class="flow" d="M1000 83H1052"/>
    <g transform="translate(1060,25)" filter="url(#shadow)">
      <rect width="218" height="116" rx="18" fill="#fffdf7" stroke="#315d66" stroke-width="2"/>
      <text x="109" y="37" text-anchor="middle" class="cardTitle">钱包签名交易</text>
      <text x="109" y="66" text-anchor="middle" class="body">approve · buy · transfer</text>
      <text x="109" y="91" text-anchor="middle" class="small">receipt 成功后刷新</text>
    </g>
    <g transform="translate(1300,42)">
      <path d="M52 0l15 31 34 5-25 24 6 34-30-16-30 16 6-34L3 36l34-5z" fill="url(#gold)" stroke="#9e6630" stroke-width="3"/>
      <circle cx="42" cy="46" r="3" fill="#6b4028"/><circle cx="62" cy="46" r="3" fill="#6b4028"/>
      <path d="M43 58q9 8 18 0" stroke="#6b4028" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Lane 2: Cloudflare and data -->
  <g transform="translate(36,304)">
    <rect width="1528" height="170" rx="24" fill="#f6f3fb" stroke="#9382a2" stroke-width="2"/>
    <rect width="190" height="170" rx="24" fill="#ebe5f7"/>
    <text x="28" y="47" class="laneTitle">02 链下服务与数据</text>
    <text x="28" y="76" class="body">富内容、会话、评论</text>
    <text x="28" y="98" class="body">链上事实不可覆盖</text>
    <g transform="translate(220,26)" filter="url(#shadow)">
      <rect width="235" height="116" rx="18" fill="#fffdf7" stroke="#806f8c" stroke-width="2"/>
      <text x="118" y="37" text-anchor="middle" class="cardTitle">Cloudflare Worker API</text>
      <text x="118" y="66" text-anchor="middle" class="body">challenge-sign-verify · 聚合读取</text>
      <text x="118" y="91" text-anchor="middle" class="small">HTTPS / CORS / 健康检查已验证</text>
    </g>
    <path class="flow" d="M465 84H517"/>
    <g transform="translate(525,26)" filter="url(#shadow)">
      <rect width="235" height="116" rx="18" fill="#fffdf7" stroke="#806f8c" stroke-width="2"/>
      <text x="118" y="37" text-anchor="middle" class="cardTitle">D1 业务数据库</text>
      <text x="118" y="66" text-anchor="middle" class="body">metadata · 视频 · 评论 · nonce</text>
      <text x="118" y="91" text-anchor="middle" class="small">远程 migrations 与读写已验证</text>
    </g>
    <path class="flow" d="M770 84H822"/>
    <g transform="translate(830,26)" filter="url(#shadow)">
      <rect width="235" height="116" rx="18" fill="#fffdf7" stroke="#806f8c" stroke-width="2"/>
      <text x="118" y="37" text-anchor="middle" class="cardTitle">稳定业务键 + 哈希</text>
      <text x="118" y="66" text-anchor="middle" class="body">chainId:marketplace:taskId</text>
      <text x="118" y="91" text-anchor="middle" class="small">哈希冲突立即停止，不自动覆盖</text>
    </g>
    <path class="deferred" d="M1075 84H1127"/>
    <g transform="translate(1135,26)" filter="url(#shadow)">
      <rect width="250" height="116" rx="18" fill="#fffdf7" stroke="#806f8c" stroke-width="2" stroke-dasharray="8 6"/>
      <text x="125" y="37" text-anchor="middle" class="cardTitle">IPFS metadata pin</text>
      <text x="125" y="66" text-anchor="middle" class="body">CID 已确定 · 独立网关待验证</text>
      <text x="125" y="91" text-anchor="middle" class="small">增强项，不阻塞核心购买闭环</text>
    </g>
  </g>

  <!-- Lane 3: Sepolia -->
  <g transform="translate(36,492)">
    <rect width="1528" height="202" rx="24" fill="#fff8e8" stroke="#d19a47" stroke-width="2"/>
    <rect width="190" height="202" rx="24" fill="#ffedc2"/>
