    <text x="28" y="78" class="body">链上业务事实</text>
    <text x="28" y="100" class="body">测试资产 · 公开可查</text>
    <g transform="translate(215,27)" filter="url(#shadow)">
      <rect width="205" height="142" rx="18" fill="#fffdf7" stroke="#c67b2b" stroke-width="2"/>
      <text x="103" y="36" text-anchor="middle" class="cardTitle">BabyCoin ERC-20</text>
      <text x="103" y="64" text-anchor="middle" class="body">余额 + lifetimeEarned</text>
      <text x="103" y="89" text-anchor="middle" class="small">0x108a…5471b</text>
      <rect x="46" y="107" width="112" height="23" rx="12" fill="#dce9c8"/><text x="102" y="123" text-anchor="middle" class="badge" fill="#355940">Sepolia 已验证</text>
    </g>
    <path class="chain" d="M430 98H472"/>
    <g transform="translate(480,27)" filter="url(#shadow)">
      <rect width="245" height="142" rx="18" fill="#fffdf7" stroke="#c67b2b" stroke-width="2"/>
      <text x="123" y="36" text-anchor="middle" class="cardTitle">TaskMarketplace V2</text>
      <text x="123" y="64" text-anchor="middle" class="body">Provider · Owner · 随机任务</text>
      <text x="123" y="89" text-anchor="middle" class="body">approve → buy → transferFrom</text>
      <text x="123" y="116" text-anchor="middle" class="small">0x2EE9…15de · 闭环已验证</text>
    </g>
    <path class="chain" d="M735 72H777"/>
    <g transform="translate(785,18)" filter="url(#shadow)">
      <rect width="205" height="80" rx="18" fill="#fffdf7" stroke="#c67b2b" stroke-width="2"/>
      <text x="103" y="32" text-anchor="middle" class="cardTitle">Chainlink VRF v2.5</text>
      <text x="103" y="57" text-anchor="middle" class="small">价格 / 时间随机履约已验证</text>
    </g>
    <path class="chain" d="M735 129H777"/>
    <g transform="translate(785,112)" filter="url(#shadow)">
      <rect width="205" height="70" rx="18" fill="#fffdf7" stroke="#c67b2b" stroke-width="2"/>
      <text x="103" y="30" text-anchor="middle" class="cardTitle">ERC-5192 SBT</text>
      <text x="103" y="53" text-anchor="middle" class="small">#1 locked · 不可转让</text>
    </g>
    <path class="chain" d="M1000 72H1042"/>
    <g transform="translate(1050,18)" filter="url(#shadow)">
      <rect width="205" height="80" rx="18" fill="#fffdf7" stroke="#c67b2b" stroke-width="2"/>
      <text x="103" y="32" text-anchor="middle" class="cardTitle">Uniswap v3</text>
      <text x="103" y="57" text-anchor="middle" class="small">BABY/USDC + BABY/WETH</text>
    </g>
    <path class="flow" d="M1000 145H1042"/>
    <g transform="translate(1050,112)" filter="url(#shadow)">
      <rect width="205" height="70" rx="18" fill="#fffdf7" stroke="#315d66" stroke-width="2"/>
      <text x="103" y="29" text-anchor="middle" class="cardTitle">The Graph v0.1.0</text>
      <text x="103" y="52" text-anchor="middle" class="small">100% synced · GraphQL 读回</text>
    </g>
    <path class="flow" d="M1265 98H1307"/>
    <g transform="translate(1315,42)" filter="url(#shadow)">
      <rect width="180" height="106" rx="18" fill="#fffdf7" stroke="#315d66" stroke-width="2"/>
      <text x="90" y="31" text-anchor="middle" class="cardTitle">三 RPC 对照</text>
      <text x="90" y="57" text-anchor="middle" class="body">Public · Infura · Alchemy</text>
      <text x="90" y="82" text-anchor="middle" class="small">同一交易事实一致</text>
    </g>
  </g>

  <!-- Lane 4: delivery and AWS -->
  <g transform="translate(36,712)">
    <rect width="1528" height="180" rx="24" fill="#f4f8fb" stroke="#668da0" stroke-width="2"/>
    <rect width="190" height="180" rx="24" fill="#dfedf3"/>
    <text x="28" y="47" class="laneTitle">04 交付、安全与清理</text>
    <text x="28" y="77" class="body">同一 Gate 本地 / GitHub</text>
    <text x="28" y="99" class="body">生产发布必须人工确认</text>
    <g transform="translate(215,29)" filter="url(#shadow)">
      <rect width="190" height="118" rx="18" fill="#fffdf7" stroke="#315d66" stroke-width="2"/>
      <text x="95" y="34" text-anchor="middle" class="cardTitle">本地 Gate</text>
      <text x="95" y="61" text-anchor="middle" class="body">测试 · 构建 · Evidence</text>
      <text x="95" y="87" text-anchor="middle" class="small">缺图 / 缺状态立即失败</text>
    </g>
    <path class="flow" d="M415 88H452"/>
    <g transform="translate(460,29)" filter="url(#shadow)">
      <rect width="205" height="118" rx="18" fill="#fffdf7" stroke="#315d66" stroke-width="2"/>
      <text x="103" y="34" text-anchor="middle" class="cardTitle">GitHub Actions</text>
      <text x="103" y="61" text-anchor="middle" class="body">共享 workflow + OIDC</text>
      <text x="103" y="87" text-anchor="middle" class="small">PR / main 同一契约</text>
    </g>
    <path class="flow" d="M675 88H712"/>
    <g transform="translate(720,29)" filter="url(#shadow)">
      <rect width="220" height="118" rx="18" fill="#fffdf7" stroke="#315d66" stroke-width="2"/>
      <text x="110" y="34" text-anchor="middle" class="cardTitle">Cloudflare 发布验证</text>
      <text x="110" y="61" text-anchor="middle" class="body">产物 · HTTP · TLS · 深链</text>
      <text x="110" y="87" text-anchor="middle" class="small">失败即停止，不切错误别名</text>
    </g>
    <path class="flow" d="M950 88H987"/>
    <g transform="translate(995,21)" filter="url(#shadow)">
      <rect width="235" height="134" rx="18" fill="#fffdf7" stroke="#55775e" stroke-width="2"/>
      <text x="118" y="32" text-anchor="middle" class="cardTitle">AWS 可暂停边界</text>
      <text x="118" y="58" text-anchor="middle" class="body">VPC · 私有 RDS · Lambda</text>
      <text x="118" y="82" text-anchor="middle" class="small">Readiness 已验证 · RDS stopped</text>
      <rect x="58" y="100" width="120" height="23" rx="12" fill="#dce9c8"/><text x="118" y="116" text-anchor="middle" class="badge" fill="#355940">费用受 Gate 保护</text>
    </g>
    <path class="deferred" d="M1240 88H1277"/>
    <g transform="translate(1285,21)" filter="url(#shadow)">
      <rect width="210" height="134" rx="18" fill="#fffdf7" stroke="#806f8c" stroke-width="2" stroke-dasharray="8 6"/>
      <text x="105" y="32" text-anchor="middle" class="cardTitle">生产 Relayer（延后）</text>
      <text x="105" y="58" text-anchor="middle" class="body">KMS · NAT · Secrets</text>
      <text x="105" y="82" text-anchor="middle" class="small">持续计费，未授权不启动</text>
      <text x="105" y="109" text-anchor="middle" class="small">清理只针对本项目资源</text>
    </g>
  </g>

  <g transform="translate(36,914)">
    <rect width="1528" height="58" rx="18" fill="#173b4d"/>
    <text x="28" y="25" class="badge" fill="#ffdda0">失败路径</text>
    <text x="28" y="44" class="small" fill="#fffaf0">哈希冲突 / VRF pending / allowance 不足 / receipt 失败 → 有界重试或停止，不重复扣款、不重复铸证</text>
    <text x="790" y="25" class="badge" fill="#b9ddbf">验证与回滚</text>
    <text x="790" y="44" class="small" fill="#fffaf0">独立 RPC / GraphQL / HTTP 读回 → 脱敏 Evidence → 失败保持上一有效部署 → PR preview 精确清理</text>
  </g>
</svg>
