AWSTemplateFormatVersion: "2010-09-09"
Description: Gated GitHub OIDC and CodeBuild bootstrap for BabySteps readiness

Parameters:
  ExistingOidcProviderArn:
    Type: String
    Default: ""
  GitHubOidcThumbprint:
    Type: String
    Default: 6938fd4d98bab03faadb97b34396831e3780aea1
    AllowedPattern: "^[0-9a-fA-F]{40}$"
    Description: Verify against GitHub/AWS documentation immediately before deployment
  RuntimeStackName:
    Type: String
    Default: babysteps-homework-readiness
    AllowedPattern: "^[a-zA-Z][-a-zA-Z0-9]{0,63}$"
  RuntimeEnvironmentName:
    Type: String
    Default: homework-readiness
  RuntimeExpiresAt:
    Type: String
  RuntimeMarketplaceAddress:
    Type: String
    AllowedPattern: "^0x[0-9a-fA-F]{40}$"
  RuntimeCertificateBaseUri:
    Type: String
    AllowedPattern: "^ipfs://.+[^/]$"
  RuntimeSepoliaRpcUrl:
    Type: String
    Default: https://ethereum-sepolia-rpc.publicnode.com
    NoEcho: true

Conditions:
  CreateOidcProvider:
    Fn::Equals:
      - Ref: ExistingOidcProviderArn
      - ""

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - Ref: GitHubOidcThumbprint
      Tags:
        - Key: Project
          Value: babysteps
        - Key: ManagedBy
          Value: cloudformation

  SourceBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireReadinessArtifacts
            Status: Enabled
            ExpirationInDays: 7
            NoncurrentVersionExpiration:
              NoncurrentDays: 7
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Project
          Value: babysteps
        - Key: Environment
          Value:
            Ref: RuntimeEnvironmentName
        - Key: ManagedBy
          Value: cloudformation
        - Key: ExpiresAt
          Value:
            Ref: RuntimeExpiresAt

  GitHubPipelineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated:
                Fn::If:
                  - CreateOidcProvider
                  - Ref: GitHubOidcProvider
                  - Ref: ExistingOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                "token.actions.githubusercontent.com:aud": sts.amazonaws.com
                "token.actions.githubusercontent.com:sub": repo:Tiancheng-Xu/babysteps:environment:aws-readiness
      Policies:
        - PolicyName: UploadAndStartOneReadinessBuild
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource:
                  Fn::Sub: "${SourceBucket.Arn}/source/*"
              - Effect: Allow
                Action:
                  - codebuild:StartBuild
                  - codebuild:BatchGetBuilds
                Resource:
                  Fn::GetAtt:
                    - ReadinessCodeBuild
                    - Arn
      Tags:
        - Key: Project
          Value: babysteps
        - Key: Environment
          Value:
            Ref: RuntimeEnvironmentName
        - Key: ManagedBy
          Value: cloudformation
        - Key: ExpiresAt
          Value:
            Ref: RuntimeExpiresAt

  CloudFormationExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ProvisionReadinessRuntime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ec2:AllocateAddress
                  - ec2:AssociateRouteTable
                  - ec2:AttachInternetGateway
                  - ec2:AuthorizeSecurityGroupEgress
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:CreateInternetGateway
                  - ec2:CreateNatGateway
                  - ec2:CreateRoute
                  - ec2:CreateRouteTable
                  - ec2:CreateSecurityGroup
                  - ec2:CreateSubnet
                  - ec2:CreateTags
                  - ec2:CreateVpc
                  - ec2:DeleteInternetGateway
                  - ec2:DeleteNatGateway
                  - ec2:DeleteRoute
                  - ec2:DeleteRouteTable
                  - ec2:DeleteSecurityGroup
                  - ec2:DeleteSubnet
                  - ec2:DeleteVpc
                  - ec2:Describe*
                  - ec2:DetachInternetGateway
                  - ec2:DisassociateRouteTable
                  - ec2:ModifySubnetAttribute
                  - ec2:ModifyVpcAttribute
                  - ec2:ReleaseAddress
                  - rds:AddTagsToResource
                  - rds:CreateDBInstance
                  - rds:CreateDBSubnetGroup
                  - rds:DeleteDBInstance
                  - rds:DeleteDBSubnetGroup
                  - rds:Describe*
                  - rds:ListTagsForResource
                  - kms:CreateKey
                  - kms:DescribeKey
                  - kms:DisableKey
                  - kms:EnableKey
                  - kms:GetKeyPolicy
                  - kms:ListResourceTags
                  - kms:PutKeyPolicy
                  - kms:ScheduleKeyDeletion
                  - kms:TagResource
                  - secretsmanager:CreateSecret
                  - secretsmanager:DeleteSecret
                  - secretsmanager:DescribeSecret
                  - secretsmanager:GetRandomPassword
                  - secretsmanager:TagResource
                Resource: "*"
              - Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:PassRole
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:TagRole
                Resource:
                  Fn::Sub: "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${RuntimeStackName}-*"
              - Effect: Allow
                Action: lambda:*
                Resource:
                  Fn::Sub: "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${RuntimeStackName}-*"
              - Effect: Allow
                Action:
                  - apigateway:DELETE
                  - apigateway:GET
                  - apigateway:PATCH
                  - apigateway:POST
                  - apigateway:PUT
                Resource:
                  Fn::Sub: "arn:${AWS::Partition}:apigateway:${AWS::Region}::/apis*"
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:DescribeLogGroups
                  - logs:ListTagsForResource
                  - logs:PutRetentionPolicy
                  - logs:TagResource
                Resource:
                  Fn::Sub: "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${RuntimeStackName}-*"
      Tags:
        - Key: Project
          Value: babysteps
        - Key: ManagedBy
          Value: cloudformation

  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ReadinessBuild
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  Fn::Sub: "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/babysteps-readiness*"
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource:
                  Fn::Sub: "${SourceBucket.Arn}/*"
              - Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:CreateStack
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStacks
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:GetTemplateSummary
                  - cloudformation:UpdateStack
                Resource:
                  Fn::Sub: "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${RuntimeStackName}/*"
              - Effect: Allow
                Action: iam:PassRole
                Resource:
                  Fn::GetAtt:
                    - CloudFormationExecutionRole
                    - Arn
      Tags:
        - Key: Project
          Value: babysteps
        - Key: ManagedBy
          Value: cloudformation

  ReadinessCodeBuild:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: babysteps-readiness
      ServiceRole:
        Fn::GetAtt:
          - CodeBuildRole
          - Arn
      ConcurrentBuildLimit: 1
      Artifacts:
        Type: NO_ARTIFACTS
      Source:
        Type: S3
        Location:
          Fn::Sub: "${SourceBucket}/source/bootstrap-placeholder.zip"
        BuildSpec: aws/buildspec.yml
      Environment:
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        Type: LINUX_CONTAINER
        EnvironmentVariables:
          - Name: ALLOW_AWS_PAID_DEPLOYMENT
            Type: PLAINTEXT
            Value: "false"
          - Name: ARTIFACT_BUCKET
            Type: PLAINTEXT
            Value:
              Ref: SourceBucket
          - Name: CLOUDFORMATION_EXECUTION_ROLE_ARN
            Type: PLAINTEXT
            Value:
              Fn::GetAtt:
                - CloudFormationExecutionRole
                - Arn
          - Name: RUNTIME_STACK_NAME
            Type: PLAINTEXT
            Value:
              Ref: RuntimeStackName
          - Name: RUNTIME_ENVIRONMENT_NAME
            Type: PLAINTEXT
            Value:
              Ref: RuntimeEnvironmentName
          - Name: RUNTIME_EXPIRES_AT
            Type: PLAINTEXT
            Value:
              Ref: RuntimeExpiresAt
          - Name: RUNTIME_MARKETPLACE_ADDRESS
            Type: PLAINTEXT
            Value:
              Ref: RuntimeMarketplaceAddress
          - Name: RUNTIME_CERTIFICATE_BASE_URI
            Type: PLAINTEXT
            Value:
              Ref: RuntimeCertificateBaseUri
          - Name: RUNTIME_SEPOLIA_RPC_URL
            Type: PLAINTEXT
            Value:
              Ref: RuntimeSepoliaRpcUrl
      Tags:
        - Key: Project
          Value: babysteps
        - Key: Environment
          Value:
            Ref: RuntimeEnvironmentName
        - Key: ManagedBy
          Value: cloudformation
        - Key: ExpiresAt
          Value:
            Ref: RuntimeExpiresAt

Outputs:
  GitHubPipelineRoleArn:
    Value:
      Fn::GetAtt:
        - GitHubPipelineRole
        - Arn
  SourceBucketName:
    Value:
      Ref: SourceBucket
  CodeBuildProjectName:
    Value:
      Ref: ReadinessCodeBuild
