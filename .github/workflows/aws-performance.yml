name: BabySteps AWS Performance Evidence

on:
  workflow_dispatch:
    inputs:
      run_cloud_validation:
        description: Create the temporary pipeline, prove one real event, then clean it up
        required: true
        default: false
        type: boolean
      approval_reference:
        description: Human approval reference for this temporary paid run
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: babysteps-performance-evidence
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.17.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @babysteps/aws test
      - run: pnpm --filter @babysteps/aws typecheck
      - run: sam validate --lint --region us-east-1 --template-file aws/performance-template.yaml
      - name: aws-budget-guard
        run: pnpm validate:performance-budget
      - run: pnpm validate:performance-pipeline

  prove-and-clean:
    if: github.ref == 'refs/heads/main' && inputs.run_cloud_validation == true
    needs: validate
    runs-on: ubuntu-latest
    # VPC Lambda deletion can spend ~20 minutes waiting for AWS-managed
    # Hyperplane ENIs to drain. Keep the cleanup gate alive long enough to
    # prove zero residue instead of abandoning an in-progress stack deletion.
    timeout-minutes: 50
    environment: aws-performance
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      STACK_NAME: babysteps-performance-${{ github.run_id }}
      ENVIRONMENT_NAME: e${{ github.run_id }}
      RUN_ID: ${{ github.run_id }}
      WEB_ORIGIN: http://127.0.0.1:4173
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.17.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PERFORMANCE_ROLE_ARN }}
          aws-region: us-east-1
      - name: Open ephemeral origin boundary
        env:
          APPROVAL_REFERENCE: ${{ inputs.approval_reference }}
        run: |
          token="$(openssl rand -hex 32)"
          echo "::add-mask::$token"
          echo "ORIGIN_TOKEN=$token" >> "$GITHUB_ENV"
          test -n "$APPROVAL_REFERENCE"
          node -e 'const c=require("crypto");process.stdout.write(`APPROVAL_REFERENCE_HASH=${c.createHash("sha256").update(process.env.APPROVAL_REFERENCE).digest("hex")}\n`)' >> "$GITHUB_ENV"
          echo "EXPIRES_AT=$(date -u -v+4H '+%Y-%m-%dT%H:%M:%SZ' 2>/dev/null || date -u -d '+4 hours' '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
      - name: Validate budget and source
        run: |
          pnpm --filter @babysteps/aws test
          pnpm --filter @babysteps/aws typecheck
          pnpm validate:performance-budget
      - name: Verify protected shared foundation is ready
        run: |
          test "$(aws ec2 describe-nat-gateways --nat-gateway-ids '${{ vars.AWS_SHARED_NAT_GATEWAY_ID }}' --query 'NatGateways[0].State' --output text)" = "available"
          test "$(aws rds describe-db-instances --db-instance-identifier '${{ vars.AWS_SHARED_DATABASE_INSTANCE_ID }}' --query 'DBInstances[0].DBInstanceStatus' --output text)" = "available"
          aws secretsmanager describe-secret --secret-id '${{ vars.AWS_SHARED_DATABASE_SECRET_ARN }}' >/dev/null
          echo "SHARED_DATABASE_HOST=$(aws rds describe-db-instances --db-instance-identifier '${{ vars.AWS_SHARED_DATABASE_INSTANCE_ID }}' --query 'DBInstances[0].Endpoint.Address' --output text)" >> "$GITHUB_ENV"
          database_name="$(aws rds describe-db-instances --db-instance-identifier '${{ vars.AWS_SHARED_DATABASE_INSTANCE_ID }}' --query 'DBInstances[0].DBName' --output text)"
          test "$database_name" != "None" || database_name=postgres
          echo "SHARED_DATABASE_NAME=$database_name" >> "$GITHUB_ENV"
      - name: Build Lambda and cleaner artifacts
        run: |
          pnpm --filter @babysteps/aws build:performance:sam
          pnpm --filter @babysteps/aws build:performance:cleaner
          cp -R aws/migrations aws/dist/performance/migrations
      - name: Enable ARM64 container builds
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Configure isolated BuildKit builder
        uses: docker/setup-buildx-action@v3
      - name: Deploy temporary project stack
        id: deploy
        run: |
          sam deploy --region "$AWS_REGION" --template-file aws/dist/performance-sam/template.yaml \
            --stack-name "$STACK_NAME" --role-arn "${{ vars.AWS_PERFORMANCE_CLOUDFORMATION_ROLE_ARN }}" \
            --s3-bucket "${{ vars.AWS_SHARED_ARTIFACT_BUCKET }}" --capabilities CAPABILITY_NAMED_IAM \
            --no-confirm-changeset --no-fail-on-empty-changeset \
            --parameter-overrides RunId="$RUN_ID" EnvironmentName="$ENVIRONMENT_NAME" ExpiresAt="$EXPIRES_AT" ApprovalReferenceHash="$APPROVAL_REFERENCE_HASH" \
            SharedVpcId="${{ vars.AWS_SHARED_VPC_ID }}" PrivateSubnetIds="${{ vars.AWS_SHARED_PRIVATE_APP_SUBNET_IDS }}" \
            SharedDatabaseSecurityGroupId="${{ vars.AWS_SHARED_DATABASE_SECURITY_GROUP_ID }}" \
            SharedDatabaseSecretArn="${{ vars.AWS_SHARED_DATABASE_SECRET_ARN }}" \
            SharedDatabaseHost="$SHARED_DATABASE_HOST" SharedDatabaseName="$SHARED_DATABASE_NAME" \
            OriginToken="$ORIGIN_TOKEN" CleanerImageTag="${GITHUB_SHA}" \
            --tags Project=babysteps-performance RunId="$RUN_ID" ExpiresAt="$EXPIRES_AT" ApprovalReferenceHash="$APPROVAL_REFERENCE_HASH"
      - name: Build and push immutable cleaner image
        run: |
          repository="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='CleanerRepositoryUri'].OutputValue" --output text)"
          aws ecr get-login-password | docker login --username AWS --password-stdin "${repository%%/*}"
          docker buildx build --platform linux/arm64 --provenance=false --push -t "$repository:$GITHUB_SHA" -f aws/performance.Dockerfile .
      - name: Initialize and rerun migration with data-retention verification
        id: database-init
        run: |
          cluster="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='ClusterArn'].OutputValue" --output text)"
          task_definition="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='DatabaseAdminTaskDefinitionArn'].OutputValue" --output text)"
          security_group="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='RuntimeSecurityGroupId'].OutputValue" --output text)"
          task="$(aws ecs run-task --cluster "$cluster" --task-definition "$task_definition" --launch-type FARGATE --network-configuration "awsvpcConfiguration={subnets=[${{ vars.AWS_SHARED_PRIVATE_APP_SUBNET_IDS }}],securityGroups=[$security_group],assignPublicIp=DISABLED}" --query 'tasks[0].taskArn' --output text)"
          echo "task=$task" >> "$GITHUB_OUTPUT"
          aws ecs wait tasks-stopped --cluster "$cluster" --tasks "$task"
          test "$(aws ecs describe-tasks --cluster "$cluster" --tasks "$task" --query 'tasks[0].containers[0].exitCode' --output text)" = "0"
          upgrade_verification_task="$(aws ecs run-task --cluster "$cluster" --task-definition "$task_definition" --launch-type FARGATE --network-configuration "awsvpcConfiguration={subnets=[${{ vars.AWS_SHARED_PRIVATE_APP_SUBNET_IDS }}],securityGroups=[$security_group],assignPublicIp=DISABLED}" --query 'tasks[0].taskArn' --output text)"
          aws ecs wait tasks-stopped --cluster "$cluster" --tasks "$upgrade_verification_task"
          test "$(aws ecs describe-tasks --cluster "$cluster" --tasks "$upgrade_verification_task" --query 'tasks[0].containers[0].exitCode' --output text)" = "0"
      - name: Start temporary Worker proxy
        id: worker-proxy
        run: |
          api="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='ApiEndpoint'].OutputValue" --output text)"
          state_dir="$RUNNER_TEMP/babysteps-worker-state"
          env_file="$RUNNER_TEMP/babysteps-performance.dev.vars"
          mkdir -p evidence "$state_dir"
          umask 077
          test "$WEB_ORIGIN" = "http://127.0.0.1:4173"
          printf 'APP_URI=http://127.0.0.1:4173\nPERFORMANCE_API_URL=%s\nPERFORMANCE_ORIGIN_TOKEN=%s\n' "$api" "$ORIGIN_TOKEN" > "$env_file"
          pnpm --filter @babysteps/worker exec wrangler d1 migrations apply DB --local --persist-to "$state_dir"
          RUNNER_TRACKING_ID='' nohup pnpm --filter @babysteps/worker exec wrangler dev --local \
            --ip 127.0.0.1 --port 8788 --persist-to "$state_dir" --env-file "$env_file" \
            --show-interactive-dev-session=false > "$RUNNER_TEMP/worker-proxy.log" 2>&1 &
          worker_pid=$!
          echo "pid=$worker_pid" >> "$GITHUB_OUTPUT"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8788/api/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          tail -n 40 "$RUNNER_TEMP/worker-proxy.log"
          exit 1
      - name: Start local Web at the exact Worker APP_URI origin
        id: local-web
        run: |
          test "$WEB_ORIGIN" = "http://127.0.0.1:4173"
          RUNNER_TRACKING_ID='' VITE_BABYSTEPS_API_URL=http://127.0.0.1:8788 VITE_APP_VERSION="${GITHUB_SHA:0:12}" VITE_PERFORMANCE_MAX_EVENTS_PER_MINUTE=20 \
            nohup pnpm --filter @babysteps/web exec vite --mode production --host 127.0.0.1 --port 4173 \
            > "$RUNNER_TEMP/local-web.log" 2>&1 &
          web_pid=$!
          echo "pid=$web_pid" >> "$GITHUB_OUTPUT"
          for attempt in $(seq 1 30); do
            if curl --fail --silent "$WEB_ORIGIN" >/dev/null; then exit 0; fi
            sleep 1
          done
          tail -n 40 "$RUNNER_TEMP/local-web.log"
          exit 1
      - name: Browser journey through real Chromium
        run: |
          pnpm exec playwright install --with-deps chromium
          node scripts/run-performance-browser-journey.mjs --origin "$WEB_ORIGIN" --artifacts-dir evidence/browser --output evidence/browser-journey.json
      - name: Run one on-demand ECS cleaning task
        id: cleaner
        run: |
          cluster="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='ClusterArn'].OutputValue" --output text)"
          task_definition="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='CleanerTaskDefinitionArn'].OutputValue" --output text)"
          security_group="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='RuntimeSecurityGroupId'].OutputValue" --output text)"
          task="$(aws ecs run-task --cluster "$cluster" --task-definition "$task_definition" --launch-type FARGATE --network-configuration "awsvpcConfiguration={subnets=[${{ vars.AWS_SHARED_PRIVATE_APP_SUBNET_IDS }}],securityGroups=[$security_group],assignPublicIp=DISABLED}" --query 'tasks[0].taskArn' --output text)"
          test -n "$task" && test "$task" != "None"
          echo "task=$task" >> "$GITHUB_OUTPUT"
          echo "cluster=$cluster" >> "$GITHUB_OUTPUT"
          CLEANER_WATCHDOG_MAX_ATTEMPTS=36
          CLEANER_WATCHDOG_INTERVAL_SECONDS=5
          cleaner_stopped=false
          for attempt in $(seq 1 "$CLEANER_WATCHDOG_MAX_ATTEMPTS"); do
            last_status="$(aws ecs describe-tasks --cluster "$cluster" --tasks "$task" --query 'tasks[0].lastStatus' --output text)"
            if test "$last_status" = "STOPPED"; then
              cleaner_stopped=true
              break
            fi
            sleep "$CLEANER_WATCHDOG_INTERVAL_SECONDS"
          done
          if test "$cleaner_stopped" != "true"; then
            aws ecs stop-task --cluster "$cluster" --task "$task" --reason "babysteps-performance-cleaner-time-budget-exceeded" >/dev/null
            for attempt in $(seq 1 12); do
              last_status="$(aws ecs describe-tasks --cluster "$cluster" --tasks "$task" --query 'tasks[0].lastStatus' --output text)"
              if test "$last_status" = "STOPPED"; then
                cleaner_stopped=true
                break
              fi
              sleep "$CLEANER_WATCHDOG_INTERVAL_SECONDS"
            done
            if test "$cleaner_stopped" != "true"; then
              echo "CLEANER_TASK_DID_NOT_STOP_AFTER_WATCHDOG" >&2
              exit 1
            fi
            echo "CLEANER_TASK_EXCEEDED_TIME_BUDGET" >&2
            exit 1
          fi
          exit_code="$(aws ecs describe-tasks --cluster "$cluster" --tasks "$task" --query 'tasks[0].containers[0].exitCode' --output text)"
          test "$exit_code" = "0"
      - name: Capture and validate exact cleaner summary
        run: |
          task='${{ steps.cleaner.outputs.task }}'
          task_id="${task##*/}"
          log_group="/babysteps/performance/$ENVIRONMENT_NAME"
          log_stream="cleaner/cleaner/$task_id"
          for attempt in $(seq 1 12); do
            if aws logs get-log-events --log-group-name "$log_group" --log-stream-name "$log_stream" --output json > cleaner-log-events.json 2>/dev/null && jq -e '.events | length > 0' cleaner-log-events.json >/dev/null; then break; fi
            sleep 5
          done
          node - <<'NODE'
          const fs = require("fs");
          const input = JSON.parse(fs.readFileSync("cleaner-log-events.json", "utf8"));
          const keys = ["deduplicated", "discarded", "durationMs", "inserted", "processed", "retryableFailures", "writeDurationMs"];
          const summaries = (input.events ?? []).flatMap(({ message }) => {
            if (typeof message !== "string" || /[\r\n]/.test(message)) return [];
            try {
              const value = JSON.parse(message);
              return value && typeof value === "object" && JSON.stringify(Object.keys(value).sort()) === JSON.stringify(keys) ? [value] : [];
            } catch { return []; }
          });
          if (summaries.length !== 1) throw new Error("EXPECTED_ONE_CLEANER_SUMMARY");
          const summary = summaries[0];
          for (const key of keys) if (!Number.isSafeInteger(summary[key]) || summary[key] < 0) throw new Error(`INVALID_CLEANER_SUMMARY_${key}`);
          if (summary.processed < 1 || summary.inserted < 1) throw new Error("CLEANER_DID_NOT_INSERT_REAL_EVENT");
          if (summary.retryableFailures !== 0) throw new Error("CLEANER_RETRYABLE_FAILURES");
          if (summary.processed !== summary.inserted + summary.deduplicated + summary.discarded + summary.retryableFailures) throw new Error("CLEANER_SUMMARY_TOTAL_MISMATCH");
          fs.writeFileSync("evidence/cleaner-summary.json", `${JSON.stringify(summary, null, 2)}\n`);
          NODE
      - name: Query and verify real browser aggregates
        run: |
          curl --fail-with-body -sS "http://127.0.0.1:8788/api/performance/stats?window=1h&environment=production&version=${GITHUB_SHA:0:12}" > evidence/performance-stats.json
          node scripts/validate-performance-readback.mjs --stats evidence/performance-stats.json
          queue_url="$(aws sqs get-queue-url --queue-name "babysteps-performance-events-$ENVIRONMENT_NAME" --query QueueUrl --output text)"
          dlq_url="$(aws sqs get-queue-url --queue-name "babysteps-performance-dlq-$ENVIRONMENT_NAME" --query QueueUrl --output text)"
          queue_visible=-1
          queue_inflight=-1
          queue_delayed=-1
          for attempt in $(seq 1 6); do
            read -r queue_visible queue_inflight queue_delayed <<< "$(aws sqs get-queue-attributes --queue-url "$queue_url" --attribute-names ApproximateNumberOfMessages ApproximateNumberOfMessagesNotVisible ApproximateNumberOfMessagesDelayed --query '[Attributes.ApproximateNumberOfMessages,Attributes.ApproximateNumberOfMessagesNotVisible,Attributes.ApproximateNumberOfMessagesDelayed]' --output text)"
            queue_total=$((queue_visible + queue_inflight + queue_delayed))
            if test "$queue_total" = "0"; then break; fi
            sleep 5
          done
          read -r dlq_visible dlq_inflight dlq_delayed <<< "$(aws sqs get-queue-attributes --queue-url "$dlq_url" --attribute-names ApproximateNumberOfMessages ApproximateNumberOfMessagesNotVisible ApproximateNumberOfMessagesDelayed --query '[Attributes.ApproximateNumberOfMessages,Attributes.ApproximateNumberOfMessagesNotVisible,Attributes.ApproximateNumberOfMessagesDelayed]' --output text)"
          queue_total=$((queue_visible + queue_inflight + queue_delayed))
          dlq_total=$((dlq_visible + dlq_inflight + dlq_delayed))
          export queue_visible queue_inflight queue_delayed queue_total dlq_visible dlq_inflight dlq_delayed dlq_total
          node - <<'NODE'
          const fs = require("fs");
          const n = (name) => Number(process.env[name]);
          fs.writeFileSync("evidence/queue-after-cleaner.json", `${JSON.stringify({
            queue: { visible: n("queue_visible"), inFlight: n("queue_inflight"), delayed: n("queue_delayed"), total: n("queue_total") },
            dlq: { visible: n("dlq_visible"), inFlight: n("dlq_inflight"), delayed: n("dlq_delayed"), total: n("dlq_total") }
          }, null, 2)}\n`);
          NODE
          test "$queue_total" = "0"
          test "$dlq_visible" = "0"
          test "$dlq_total" = "0"
      - name: Capture live performance dashboard Evidence
        run: |
          node scripts/run-performance-browser-journey.mjs --origin "$WEB_ORIGIN" --artifacts-dir evidence/browser --dashboard-only --version "${GITHUB_SHA:0:12}" --output evidence/performance-dashboard-journey.json
      - name: Capture sanitized run metadata
        if: always()
        run: |
          mkdir -p evidence
          node -e 'const fs=require("fs");fs.writeFileSync("evidence/run.json",JSON.stringify({commit:process.env.GITHUB_SHA,approvalReferenceSha256:process.env.APPROVAL_REFERENCE_HASH,region:process.env.AWS_REGION,runId:process.env.RUN_ID,ttlExpiresAt:process.env.EXPIRES_AT},null,2))'
      - name: Capture real control-plane snapshot before cleanup
        if: always() && steps.deploy.outcome == 'success'
        run: |
          stack_status="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query 'Stacks[0].StackStatus' --output text)"
          repository="babysteps-performance-cleaner-$ENVIRONMENT_NAME"
          ecr_images="$(aws ecr list-images --repository-name "$repository" --query 'length(imageIds)' --output text)"
          cluster="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='ClusterArn'].OutputValue" --output text)"
          ecs_cluster_status="$(aws ecs describe-clusters --clusters "$cluster" --query 'clusters[0].status' --output text)"
          ecs_task_count="$(aws ecs list-tasks --cluster "$cluster" --desired-status STOPPED --query 'length(taskArns)' --output text)"
          cleaner_exit_code=-1
          if test -n "${{ steps.cleaner.outputs.task }}"; then
            cleaner_exit_code="$(aws ecs describe-tasks --cluster "$cluster" --tasks "${{ steps.cleaner.outputs.task }}" --query 'tasks[0].containers[0].exitCode' --output text)"
          fi
          cleaner_task_definition="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='CleanerTaskDefinitionArn'].OutputValue" --output text)"
          admin_task_definition="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='DatabaseAdminTaskDefinitionArn'].OutputValue" --output text)"
          task_definition_count=0
          aws ecs describe-task-definition --task-definition "$cleaner_task_definition" >/dev/null && task_definition_count=$((task_definition_count + 1))
          aws ecs describe-task-definition --task-definition "$admin_task_definition" >/dev/null && task_definition_count=$((task_definition_count + 1))
          queue_url="$(aws sqs get-queue-url --queue-name "babysteps-performance-events-$ENVIRONMENT_NAME" --query QueueUrl --output text)"
          dlq_url="$(aws sqs get-queue-url --queue-name "babysteps-performance-dlq-$ENVIRONMENT_NAME" --query QueueUrl --output text)"
          sqs_visible="$(aws sqs get-queue-attributes --queue-url "$queue_url" --attribute-names ApproximateNumberOfMessages --query 'Attributes.ApproximateNumberOfMessages' --output text)"
          dlq_visible="$(aws sqs get-queue-attributes --queue-url "$dlq_url" --attribute-names ApproximateNumberOfMessages --query 'Attributes.ApproximateNumberOfMessages' --output text)"
          api_endpoint="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='ApiEndpoint'].OutputValue" --output text)"
          api_id="${api_endpoint#https://}"
          api_id="${api_id%%.*}"
          test -n "$api_id" && test "$api_id" != "$api_endpoint"
          aws apigatewayv2 get-api --api-id "$api_id" >/dev/null
          lambda_count=0
          for function_name in "babysteps-performance-ingest-$ENVIRONMENT_NAME" "babysteps-performance-query-$ENVIRONMENT_NAME"; do
            aws lambda get-function --function-name "$function_name" >/dev/null && lambda_count=$((lambda_count + 1))
          done
          log_group_count=0
          for log_group in "/babysteps/performance/$ENVIRONMENT_NAME" "/aws/lambda/babysteps-performance-ingest-$ENVIRONMENT_NAME" "/aws/lambda/babysteps-performance-query-$ENVIRONMENT_NAME"; do
            count="$(aws logs describe-log-groups --log-group-name-prefix "$log_group" --query "length(logGroups[?logGroupName=='$log_group'])" --output text)"
            log_group_count=$((log_group_count + count))
          done
          secret_count=0
          for secret_name in "babysteps-performance-db-$ENVIRONMENT_NAME" "babysteps-performance-origin-$ENVIRONMENT_NAME"; do
            aws secretsmanager describe-secret --secret-id "$secret_name" >/dev/null && secret_count=$((secret_count + 1))
          done
          security_group="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='RuntimeSecurityGroupId'].OutputValue" --output text)"
          aws ec2 describe-security-groups --group-ids "$security_group" >/dev/null
          echo "RUNTIME_SECURITY_GROUP_ID=$security_group" >> "$GITHUB_ENV"
          iam_role_count=0
          for role_name in "babysteps-performance-execution-$ENVIRONMENT_NAME" "babysteps-performance-task-$ENVIRONMENT_NAME" "babysteps-performance-db-admin-$ENVIRONMENT_NAME" "babysteps-performance-query-$ENVIRONMENT_NAME"; do
            aws iam get-role --role-name "$role_name" >/dev/null && iam_role_count=$((iam_role_count + 1))
          done
          export stack_status ecr_images ecs_cluster_status ecs_task_count cleaner_exit_code task_definition_count sqs_visible dlq_visible lambda_count log_group_count secret_count iam_role_count
          node - <<'NODE'
          const fs = require("fs");
          const number = (name) => Number(process.env[name]);
          fs.writeFileSync("evidence/control-plane-before-cleanup.json", JSON.stringify({
            stack: { status: process.env.stack_status },
            ecr: { imageCount: number("ecr_images") },
            ecs: { clusterStatus: process.env.ecs_cluster_status, taskCount: number("ecs_task_count"), cleanerExitCode: number("cleaner_exit_code"), taskDefinitionCount: number("task_definition_count") },
            sqs: { visibleMessages: number("sqs_visible"), dlqVisibleMessages: number("dlq_visible") },
            apiGateway: { present: true }, lambda: { count: number("lambda_count") },
            cloudWatch: { logGroupCount: number("log_group_count") }, cleanerSummary: JSON.parse(fs.readFileSync("evidence/cleaner-summary.json", "utf8")), secrets: { count: number("secret_count") },
            securityGroup: { present: true }, iam: { roleCount: number("iam_role_count") },
            sharedResources: { vpc: "protected-read-only", nat: "protected-read-only", database: "protected-read-only", oidc: "protected-read-only", artifactBucket: "protected-read-only", foundation: "explicit deny cleanup" }
          }, null, 2));
          NODE
      - name: Stop local Web
        if: always() && steps.local-web.outputs.pid != ''
        run: kill "${{ steps.local-web.outputs.pid }}" 2>/dev/null || true
      - name: Stop temporary Worker proxy
        if: always() && steps.worker-proxy.outputs.pid != ''
        run: kill "${{ steps.worker-proxy.outputs.pid }}" 2>/dev/null || true
      - name: DROP SCHEMA using exact schema-cleanup task
        id: schema-cleanup
        if: always() && steps.database-init.outputs.task != ''
        run: |
          cluster="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='ClusterArn'].OutputValue" --output text)"
          task_definition="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='DatabaseAdminTaskDefinitionArn'].OutputValue" --output text)"
          security_group="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='RuntimeSecurityGroupId'].OutputValue" --output text)"
          for attempt in 1 2 3; do
            cleanup_task="$(aws ecs run-task --cluster "$cluster" --task-definition "$task_definition" --launch-type FARGATE --overrides '{"containerOverrides":[{"name":"cleaner","environment":[{"name":"CLEANER_MODE","value":"cleanup-schema"}]}]}' --network-configuration "awsvpcConfiguration={subnets=[${{ vars.AWS_SHARED_PRIVATE_APP_SUBNET_IDS }}],securityGroups=[$security_group],assignPublicIp=DISABLED}" --query 'tasks[0].taskArn' --output text)"
            aws ecs wait tasks-stopped --cluster "$cluster" --tasks "$cleanup_task"
            if test "$(aws ecs describe-tasks --cluster "$cluster" --tasks "$cleanup_task" --query 'tasks[0].containers[0].exitCode' --output text)" = "0"; then
              verify_task="$(aws ecs run-task --cluster "$cluster" --task-definition "$task_definition" --launch-type FARGATE --overrides '{"containerOverrides":[{"name":"cleaner","environment":[{"name":"CLEANER_MODE","value":"verify-schema-absent"}]}]}' --network-configuration "awsvpcConfiguration={subnets=[${{ vars.AWS_SHARED_PRIVATE_APP_SUBNET_IDS }}],securityGroups=[$security_group],assignPublicIp=DISABLED}" --query 'tasks[0].taskArn' --output text)"
              aws ecs wait tasks-stopped --cluster "$cluster" --tasks "$verify_task"
              if test "$(aws ecs describe-tasks --cluster "$cluster" --tasks "$verify_task" --query 'tasks[0].containers[0].exitCode' --output text)" = "0"; then
                printf '{"schemaDeleted":true,"schemaAbsenceVerified":true,"attempt":%s}\n' "$attempt" > evidence/schema-cleanup.json
                exit 0
              fi
            fi
          done
          printf '{"schemaDeleted":false,"attempts":3}\n' > evidence/schema-cleanup.json
          exit 1
      - name: Delete exact project stack
        id: delete-stack
        if: always() && (steps.database-init.outputs.task == '' || steps.schema-cleanup.outcome == 'success')
        run: |
          if aws cloudformation describe-stacks --stack-name "$STACK_NAME" >/dev/null 2>&1; then
            aws cloudformation delete-stack --stack-name "$STACK_NAME" --role-arn "${{ vars.AWS_PERFORMANCE_CLOUDFORMATION_ROLE_ARN }}"
            aws cloudformation wait stack-delete-complete --stack-name "$STACK_NAME"
          fi
          for family in "babysteps-performance-cleaner-$ENVIRONMENT_NAME" "babysteps-performance-db-admin-$ENVIRONMENT_NAME"; do
            definitions="$(aws ecs list-task-definitions --family-prefix "$family" --status INACTIVE --query 'taskDefinitionArns' --output text)"
            for definition in $definitions; do
              actual_family="$(aws ecs describe-task-definition --task-definition "$definition" --query 'taskDefinition.family' --output text)"
              test "$actual_family" = "$family"
              aws ecs delete-task-definitions --task-definitions "$definition" >/dev/null
            done
          done
          if aws cloudformation describe-stacks --stack-name "$STACK_NAME" >/dev/null 2>&1; then exit 1; fi
          ecr_remaining=0
          aws ecr describe-repositories --repository-names "babysteps-performance-cleaner-$ENVIRONMENT_NAME" >/dev/null 2>&1 && ecr_remaining=1
          ecs_clusters="$(aws ecs list-clusters --query "clusterArns[?contains(@, 'babysteps-performance-$ENVIRONMENT_NAME')]" --output text)"
          ecs_cluster_remaining=0
          ecs_task_remaining=0
          for cluster in $ecs_clusters; do
            ecs_cluster_remaining=$((ecs_cluster_remaining + 1))
            for status in RUNNING PENDING; do
              count="$(aws ecs list-tasks --cluster "$cluster" --desired-status "$status" --query 'length(taskArns)' --output text)"
              ecs_task_remaining=$((ecs_task_remaining + count))
            done
          done
          task_definition_remaining=0
          for status in ACTIVE INACTIVE; do
            for family in "babysteps-performance-cleaner-$ENVIRONMENT_NAME" "babysteps-performance-db-admin-$ENVIRONMENT_NAME"; do
              definitions="$(aws ecs list-task-definitions --family-prefix "$family" --status "$status" --query 'taskDefinitionArns' --output text)"
              for definition in $definitions; do
                actual_family="$(aws ecs describe-task-definition --task-definition "$definition" --query 'taskDefinition.family' --output text)"
                test "$actual_family" = "$family"
                task_definition_remaining=$((task_definition_remaining + 1))
              done
            done
          done
          sqs_remaining=0
          for queue_name in "babysteps-performance-events-$ENVIRONMENT_NAME" "babysteps-performance-dlq-$ENVIRONMENT_NAME"; do
            aws sqs get-queue-url --queue-name "$queue_name" >/dev/null 2>&1 && sqs_remaining=$((sqs_remaining + 1))
          done
          api_remaining="$(aws apigatewayv2 get-apis --query "length(Items[?Name=='babysteps-performance-api-$ENVIRONMENT_NAME'])" --output text)"
          lambda_remaining="$(aws lambda list-functions --query "length(Functions[?starts_with(FunctionName, 'babysteps-performance-') && contains(FunctionName, '$ENVIRONMENT_NAME')])" --output text)"
          log_remaining=0
          for log_group in "/babysteps/performance/$ENVIRONMENT_NAME" "/aws/lambda/babysteps-performance-ingest-$ENVIRONMENT_NAME" "/aws/lambda/babysteps-performance-query-$ENVIRONMENT_NAME"; do
            count="$(aws logs describe-log-groups --log-group-name-prefix "$log_group" --query "length(logGroups[?logGroupName=='$log_group'])" --output text)"
            log_remaining=$((log_remaining + count))
          done
          secret_remaining="$(aws secretsmanager list-secrets --include-planned-deletion --filters Key=name,Values="babysteps-performance-" --query "length(SecretList[?contains(Name, '$ENVIRONMENT_NAME')])" --output text)"
          security_group_remaining="$(aws ec2 describe-security-groups --filters Name=tag:Project,Values=babysteps-performance Name=tag:RunId,Values="$RUN_ID" --query 'length(SecurityGroups)' --output text)"
          ingress_remaining=0
          if test -n "${RUNTIME_SECURITY_GROUP_ID:-}"; then
            ingress_remaining="$(aws ec2 describe-security-group-rules --filters Name=group-id,Values='${{ vars.AWS_SHARED_DATABASE_SECURITY_GROUP_ID }}' --query "length(SecurityGroupRules[?ReferencedGroupInfo.GroupId=='$RUNTIME_SECURITY_GROUP_ID'])" --output text)"
          fi
          iam_remaining="$(aws iam list-roles --query "length(Roles[?starts_with(RoleName, 'babysteps-performance-') && contains(RoleName, '$ENVIRONMENT_NAME')])" --output text)"
          remaining=$((ecr_remaining + ecs_cluster_remaining + ecs_task_remaining + task_definition_remaining + sqs_remaining + api_remaining + lambda_remaining + log_remaining + secret_remaining + security_group_remaining + ingress_remaining + iam_remaining))
          export remaining ecr_remaining ecs_cluster_remaining ecs_task_remaining task_definition_remaining sqs_remaining api_remaining lambda_remaining log_remaining secret_remaining security_group_remaining ingress_remaining iam_remaining
          node - <<'NODE'
          const fs = require("fs");
          const n = (key) => Number(process.env[key]);
          fs.writeFileSync("evidence/cleanup.json", JSON.stringify({
            cloudFormationStackAbsent: true,
            remainingProjectResources: n("remaining"),
            inventory: { ecr: n("ecr_remaining"), ecsClusters: n("ecs_cluster_remaining"), ecsTasks: n("ecs_task_remaining"), taskDefinitions: n("task_definition_remaining"), sqsAndDlq: n("sqs_remaining"), apiGateway: n("api_remaining"), lambda: n("lambda_remaining"), cloudWatchLogGroups: n("log_remaining"), secrets: n("secret_remaining"), securityGroups: n("security_group_remaining"), securityGroupIngress: n("ingress_remaining"), iamRoles: n("iam_remaining") },
            sharedResources: { vpc: "protected-read-only", nat: "protected-read-only", database: "protected-read-only", oidc: "protected-read-only", artifactBucket: "protected-read-only", foundation: "explicit deny cleanup" }
          }, null, 2));
          NODE
          test "$remaining" = "0"
      - name: Record incomplete cleanup without claiming success
        if: always() && steps.delete-stack.outcome != 'success'
        run: |
          printf '{"cloudFormationStackAbsent":false,"remainingProjectResources":-1,"schemaCleanupCertain":false,"sharedFoundationProtected":true,"manualRetryRequired":true}\n' > evidence/cleanup-incomplete.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: babysteps-performance-evidence-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
