name: BabySteps AWS Performance Recovery

on:
  workflow_dispatch:
    inputs:
      stack_name:
        description: Exact failed run stack, for example babysteps-performance-123456
        required: true
        type: string
      approval_reference:
        description: Human approval reference for exact project cleanup
        required: true
        type: string
      acknowledge_pre_database_failure:
        description: Confirm Evidence proves the container failed before database access
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: babysteps-performance-evidence
  cancel-in-progress: false

jobs:
  recover-exact-stack:
    if: inputs.acknowledge_pre_database_failure == true
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: aws-performance
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      STACK_NAME: ${{ inputs.stack_name }}
    steps:
      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PERFORMANCE_ROLE_ARN }}
          aws-region: us-east-1
      - name: Validate exact recovery target
        run: |
          [[ "$STACK_NAME" =~ ^babysteps-performance-[0-9]+$ ]]
          test '${{ inputs.approval_reference }}' != ''
          if aws cloudformation describe-stacks --stack-name "$STACK_NAME" >/dev/null 2>&1; then
            aws cloudformation describe-stack-resources --stack-name "$STACK_NAME" \
              --query 'StackResources[].{logicalId:LogicalResourceId,type:ResourceType,status:ResourceStatus}' \
              > resources-before-cleanup.json
          else
            printf '[]\n' > resources-before-cleanup.json
          fi
      - name: Delete exact failed project stack
        run: |
          if aws cloudformation describe-stacks --stack-name "$STACK_NAME" >/dev/null 2>&1; then
            aws cloudformation delete-stack --stack-name "$STACK_NAME" \
              --role-arn '${{ vars.AWS_PERFORMANCE_CLOUDFORMATION_ROLE_ARN }}'
            aws cloudformation wait stack-delete-complete --stack-name "$STACK_NAME"
          fi
      - name: Verify exact project resource cleanup
        run: |
          run_id="${STACK_NAME##*-}"
          environment_name="e${run_id}"
          if aws cloudformation describe-stacks --stack-name "$STACK_NAME" >/dev/null 2>&1; then
            echo "Expected CloudFormation stack to be absent: $STACK_NAME" >&2
            exit 1
          fi
          test "$(aws ecs list-clusters --query "clusterArns[?contains(@, '$environment_name')] | length(@)" --output text)" = "0"
          repository_name="babysteps-performance-cleaner-$environment_name"
          if aws ecr describe-repositories --repository-names "$repository_name" >/dev/null 2>&1; then
            echo "Expected ECR repository to be absent: $repository_name" >&2
            exit 1
          fi
          for queue_name in "babysteps-performance-events-$environment_name" "babysteps-performance-dlq-$environment_name"; do
            if aws sqs get-queue-url --queue-name "$queue_name" >/dev/null 2>&1; then
              echo "Expected queue to be absent: $queue_name" >&2
              exit 1
            fi
          done
          for family in "babysteps-performance-cleaner-$environment_name" "babysteps-performance-db-admin-$environment_name"; do
            status="$(aws ecs describe-task-definition --task-definition "$family:1" --query 'taskDefinition.status' --output text 2>/dev/null || echo MISSING)"
            test "$status" != "ACTIVE"
          done
          APPROVAL_REFERENCE='${{ inputs.approval_reference }}' node -e 'const fs=require("fs"),crypto=require("crypto");fs.mkdirSync("evidence",{recursive:true});fs.writeFileSync("evidence/recovery-cleanup.json",JSON.stringify({cloudFormationStackAbsent:true,remainingRunnableProjectResources:0,sharedFoundationProtected:true,approvalReferenceSha256:crypto.createHash("sha256").update(process.env.APPROVAL_REFERENCE).digest("hex")},null,2))'
      - name: Preserve sanitized recovery proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: babysteps-performance-recovery-${{ github.run_id }}
          path: |
            resources-before-cleanup.json
            evidence/recovery-cleanup.json
          retention-days: 14
