specVersion: 1.3.0
description: BabySteps V2 delivery event index (local manifest; address/startBlock replaced at deployment)
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: TaskMarketplaceV2
    network: sepolia
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: TaskMarketplaceV2
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - RoleAssignment
        - Task
        - Purchase
        - Certificate
      abis:
        - name: TaskMarketplaceV2
          file: ./abis/TaskMarketplaceV2.json
      eventHandlers:
        - event: RoleGranted(indexed bytes32,indexed address,indexed address)
          handler: handleRoleGranted
        - event: RoleRevoked(indexed bytes32,indexed address,indexed address)
          handler: handleRoleRevoked
        - event: TaskRequested(indexed uint256,indexed address,indexed address,uint8,string,bytes32)
          handler: handleTaskRequested
        - event: TaskApproved(indexed uint256,indexed uint256,indexed address)
          handler: handleTaskApproved
        - event: TaskRejected(indexed uint256,indexed address,indexed bytes32)
          handler: handleTaskRejected
        - event: TaskRandomized(indexed uint256,indexed uint256,uint256,uint256,uint256)
          handler: handleTaskRandomized
        - event: TaskPauseChanged(indexed uint256,bool)
          handler: handleTaskPauseChanged
        - event: PurchaseCreated(indexed uint256,indexed uint256,indexed address,uint256,uint256)
          handler: handlePurchaseCreated
        - event: CompletionConfirmed(indexed uint256,indexed uint256,indexed address,bytes32)
          handler: handleCompletionConfirmed
        - event: CertificateMinted(indexed uint256,indexed uint256,indexed address)
          handler: handleCertificateMinted
      file: ./src/task-marketplace.ts
